name: Build Jarvis APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK parts
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q jarvis-android.zip
      - run: cd jarvis && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
